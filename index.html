<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yabroʌlese Translator</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #00ffcc;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-align: center;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 650px;
            width: 100%;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #bbb;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #2d2d2d;
            border: 2px solid #3d3d3d;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #00ffcc;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .special-btn {
            background-color: #2d2d2d;
            color: #00ffcc;
            border: 1px solid #3d3d3d;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .special-btn:hover {
            background-color: #00ffcc;
            color: #121212;
            transform: translateY(-2px);
        }

        .output-panel {
            margin-top: 20px;
            background-color: #181818;
            border: 2px dashed #3d3d3d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        canvas {
            background-color: #ffffff;
            border-radius: 4px;
            max-width: 100%;
        }

        .instructions {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>yabroʌlese</h1>

    <div class="container">
        <label for="inputText">Type in English or use special letters:</label>
        <textarea id="inputText" placeholder="Type here to translate into Yabroʌlese..."></textarea>

        <div class="button-grid">
            <button class="special-btn" onclick="insertChar('Ħ')">Ħ</button>
            <button class="special-btn" onclick="insertChar('Ǧ')">Ǧ</button>
            <button class="special-btn" onclick="insertChar('L̄')">L̄</button>
            <button class="special-btn" onclick="insertChar('Đ')">Đ</button>
            <button class="special-btn" onclick="insertChar('Þ')">Þ</button>
        </div>

        <label>Yabroʌlese Script Output:</label>
        <div class="output-panel">
            <canvas id="outputCanvas" width="550" height="80"></canvas>
        </div>

        <p class="instructions">Letters without an assigned symbol will render as a small blank space. Supports upper and lowercase.</p>
    </div>

    <script>
        const textarea = document.getElementById('inputText');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');

        // Draw basic strokes for each character
        function drawSymbol(ctx, char, x, y, size) {
            ctx.save();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            switch (char.toUpperCase()) {
                case 'A':
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y + 5);
                    ctx.lineTo(x + 5, y + size - 10);
                    ctx.lineTo(x + size - 5, y + size - 10);
                    ctx.stroke();
                    break;
                case 'B':
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y + 5);
                    ctx.lineTo(x + size - 5, y + 5);
                    ctx.moveTo(x + size/2, y + 5);
                    ctx.lineTo(x + 5, y + size - 5);
                    ctx.stroke();
                    break;
                case 'C':
                    ctx.beginPath();
                    ctx.moveTo(x + 15, y + 5);
                    ctx.lineTo(x + 5, y + 25);
                    ctx.stroke();
                    break;
                case 'W':
                    ctx.beginPath();
                    ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI * 1.5);
                    ctx.stroke();
                    break;
                case 'Z':
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y + 5);
                    ctx.lineTo(x + size - 5, y + 5);
                    ctx.lineTo(x + 5, y + size - 5);
                    ctx.lineTo(x + size - 5, y + size - 5);
                    ctx.stroke();
                    break;
                case 'Ħ':
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y + 5);
                    ctx.lineTo(x + size/2, y + size - 5);
                    ctx.moveTo(x + size - 5, y + 5);
                    ctx.lineTo(x + size/2, y + size - 5);
                    ctx.stroke();
                    break;
                default:
                    // Fallback rune for characters not yet fully mapped
                    ctx.beginPath();
                    ctx.moveTo(x + size/4, y + 5);
                    ctx.lineTo(x + size/2, y + size - 5);
                    ctx.lineTo(x + 3*size/4, y + 5);
                    ctx.stroke();
                    break;
            }
            ctx.restore();
        }

        function renderScript() {
            const text = textarea.value;
            const charSize = 35;
            const spacing = 12;
            const padding = 15;
            
            // Auto-resize canvas width based on text length
            const totalWidth = Math.max(550, (text.length * (charSize + spacing)) + (padding * 2));
            canvas.width = totalWidth;

            // Clear canvas to solid white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let currentX = padding;
            let currentY = (canvas.height - charSize) / 2;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (char === ' ') {
                    currentX += charSize; 
                } else if (char === '\n') {
                    currentX = padding;
                } else {
                    drawSymbol(ctx, char, currentX, currentY, charSize);
                    currentX += charSize + spacing;
                }
            }
        }

        function insertChar(char) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const currentVal = textarea.value;
            
            textarea.value = currentVal.substring(0, start) + char + currentVal.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + char.length;
            renderScript();
        }

        textarea.addEventListener('input', renderScript);
        
        // Initial draw on page load
        renderScript();
    </script>
</body>
</html>
